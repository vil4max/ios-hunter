name: IMAP Recruiter Poll

on:
  workflow_dispatch:
  # After Collect finishes (board already updated), so mail CRM never races Inbox seed.
  workflow_run:
    workflows: ["Collect iOS Jobs"]
    types:
      - completed

permissions:
  contents: write
  issues: read

concurrency:
  group: imap-recruiter-poll-${{ github.repository }}
  cancel-in-progress: false

jobs:
  poll:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Poll IMAP and sync CRM
        id: poll
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAREER_AGENT_TOKEN: ${{ secrets.CAREER_AGENT_TOKEN }}
          CAREER_AGENT_SYNC_ENABLED: ${{ vars.CAREER_AGENT_SYNC_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAREER_PROJECT_OWNER: ${{ vars.CAREER_PROJECT_OWNER }}
          CAREER_PROJECT_NUMBER: ${{ vars.CAREER_PROJECT_NUMBER }}
          PROJECT_BOARD_URL: ${{ vars.PROJECT_BOARD_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          IMAP_FOLDER: ${{ vars.IMAP_FOLDER }}
          EMAIL_SEEN_PATH: database/email_seen.json
        run: python3 scripts/run_imap_poll.py

      - name: Commit email seen store
        id: commit_seen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/email_seen.json
          if git diff --staged --quiet; then
            echo "No email_seen changes to commit."
            exit 0
          fi
          git commit -m "chore(email_seen): record processed recruiter mail [skip ci]"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --include-untracked -m "imap-ci-dirty-${attempt}" || true
            fi
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then
              echo "Pushed email_seen on attempt ${attempt}"
              exit 0
            fi
            echo "Push race on attempt ${attempt}, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Failed to push email_seen after retries" >&2
          exit 1

      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "TELEGRAM_* missing — skip failure alert"
            exit 0
          fi
          reason="unknown step"
          if [ "${{ steps.poll.conclusion }}" = "failure" ]; then reason="IMAP poll / CRM sync"; fi
          if [ "${{ steps.commit_seen.conclusion }}" = "failure" ]; then reason="commit email_seen"; fi
          text="$(printf '⚠️ IMAP Recruiter Poll failed (%s)\n%s/%s/actions/runs/%s' \
            "${reason}" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
