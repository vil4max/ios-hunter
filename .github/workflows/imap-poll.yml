name: IMAP Recruiter Poll

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  issues: read

concurrency:
  group: imap-recruiter-poll-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  poll:
    concurrency:
      group: career-state-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh runtime state
        id: refresh_state
        run: python3 scripts/runtime_state.py refresh database/email_seen.json

      - name: Poll IMAP and sync CRM
        id: poll
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAREER_AGENT_TOKEN: ${{ secrets.CAREER_AGENT_TOKEN }}
          CAREER_AGENT_SYNC_ENABLED: ${{ vars.CAREER_AGENT_SYNC_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAREER_PROJECT_OWNER: ${{ vars.CAREER_PROJECT_OWNER }}
          CAREER_PROJECT_NUMBER: ${{ vars.CAREER_PROJECT_NUMBER }}
          PROJECT_BOARD_URL: ${{ vars.PROJECT_BOARD_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_PORT: ${{ vars.IMAP_PORT }}
          IMAP_FOLDER: ${{ vars.IMAP_FOLDER }}
          EMAIL_SEEN_PATH: database/email_seen.json
        run: python3 scripts/run_imap_poll.py

      - name: Publish runtime state
        id: commit_seen
        if: ${{ !cancelled() && (steps.poll.outcome == 'success' || steps.poll.outcome == 'failure') }}
        run: python3 scripts/runtime_state.py publish

      - name: Upload runtime state recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imap-poll-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            database/email_seen.json
            diagnostics/runtime-state*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "TELEGRAM_* missing — skip failure alert"
            exit 0
          fi
          reason="unknown step"
          if [ "${{ steps.poll.conclusion }}" = "failure" ]; then reason="IMAP poll / CRM sync"; fi
          if [ "${{ steps.commit_seen.conclusion }}" = "failure" ]; then reason="commit email_seen"; fi
          text="$(printf '⚠️ IMAP Recruiter Poll failed (%s)\n%s/%s/actions/runs/%s' \
            "${reason}" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null
