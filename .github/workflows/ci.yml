name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest -q

      - name: Verify imports
        run: python3 -c "from collector.companies import collect_all; from database.seen import load_seen; from integrations.notify import format_vacancies_message; from integrations.email_smtp import credentials_configured; from integrations.email_imap import credentials_configured as imap_ok; from integrations.mail_classify import classify_mail; from integrations.hirify_export import parse_applications_xlsx; from project_sync.sync import ProjectSync; from project_sync.liveness import run_vacancy_liveness; from project_sync.mail_sync import run_mail_sync; from project_sync.hirify_sync import run_hirify_sync; from planner.plan import build_plan; from reporter.hourly import format_hourly_new_vacancies; from reporter.daily import format_full_daily_report; from reporter.vacancy_liveness import format_vacancy_liveness_report; from reporter.imap_poll import format_imap_poll_message; from reporter.hirify_sync import format_hirify_sync_message"
