name: Hourly Collect Trigger

on:
  workflow_dispatch:
  schedule:
    # Every hour UTC; Kyiv 09:00-18:00 gate skips nights (narrow cron was unreliable on GHA).
    - cron: "0 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: hourly-collect-trigger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kyiv business-hours gate
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — gate bypassed"
            exit 0
          fi
          if python3 scripts/should_run_collect.py; then
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_gate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Collect iOS Jobs
        if: steps.gate.outputs.skip_gate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          attempt=1
          max_attempts=5
          delay=15
          while true; do
            echo "Dispatch attempt ${attempt}/${max_attempts}"
            if gh workflow run "Collect iOS Jobs" --repo "${repo}" --ref main; then
              echo "Collect iOS Jobs dispatched successfully"
              exit 0
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Failed to dispatch Collect iOS Jobs after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "Dispatch failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
