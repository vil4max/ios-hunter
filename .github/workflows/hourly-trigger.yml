name: Collect Schedule Trigger

on:
  workflow_dispatch:
  schedule:
    # Hourly :17 UTC across Kyiv daytime UTC band (EET/EEST).
    # Gate uses due Kyiv slot 09/12/15/18 with catch-up until the next slot
    # (GHA schedule lag) and skips if database/collect_slots.json already has it.
    - cron: "17 6-16 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: collect-schedule-trigger-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kyiv collect-slot gate
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
            echo "final_slot=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — gate bypassed (collect; IMAP follows via workflow_run)"
            exit 0
          fi
          set +e
          output="$(python3 scripts/should_run_collect.py)"
          status=$?
          set -e
          echo "$output"
          kyiv_hour="$(printf '%s\n' "$output" | awk -F= '/^kyiv_hour=/{print $2; exit}')"
          final_slot="$(printf '%s\n' "$output" | awk -F= '/^final_slot=/{print $2; exit}')"
          echo "kyiv_hour=${kyiv_hour}" >> "$GITHUB_OUTPUT"
          echo "final_slot=${final_slot:-false}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "skip_gate=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_gate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Collect iOS Jobs
        if: steps.gate.outputs.skip_gate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          attempt=1
          max_attempts=5
          delay=15
          while true; do
            echo "Dispatch Collect attempt ${attempt}/${max_attempts}"
            if gh workflow run "Collect iOS Jobs" --repo "${repo}" --ref main; then
              echo "Collect iOS Jobs dispatched successfully"
              break
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Failed to dispatch Collect iOS Jobs after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "Dispatch failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      # IMAP Recruiter Poll starts via workflow_run after Collect iOS Jobs completes
      # (see .github/workflows/imap-poll.yml) — never in parallel with Collect.

      - name: Trigger Daily Email Report
        if: steps.gate.outputs.skip_gate != 'true' && steps.gate.outputs.final_slot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          attempt=1
          max_attempts=5
          delay=15
          while true; do
            echo "Dispatch Daily Email attempt ${attempt}/${max_attempts}"
            if gh workflow run "Daily Email Report" --repo "${repo}" --ref main; then
              echo "Daily Email Report dispatched successfully"
              exit 0
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Failed to dispatch Daily Email Report after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "Dispatch failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
