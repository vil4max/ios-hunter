name: Collect iOS Jobs

on:
  workflow_dispatch:
  # Scheduled Kyiv 09/12/15/18 via .github/workflows/hourly-trigger.yml
  # (ubuntu → workflow_dispatch). IMAP follows as an explicit dependent job.
  # Final Kyiv slot 18 may also dispatch Daily Email (deduped with schedule trigger).

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: collect-ios-jobs-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    concurrency:
      group: career-state-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare directories
        run: mkdir -p database

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore optional AI detail cache
        uses: actions/cache@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: .cache/ai-details.json
          key: ai-details-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-details-v1-${{ runner.os }}-

      - name: Refresh runtime state
        id: refresh_state
        run: python3 scripts/runtime_state.py refresh database/seen.json database/source_baseline.json database/collect_slots.json database/telegram_cursors.json database/daily_email_days.json

      - name: Run Python pipeline
        id: pipe
        env:
          SEEN_PATH: database/seen.json
          COLLECT_DIAGNOSTICS_PATH: diagnostics/collect.json
          DETAIL_CACHE_PATH: .cache/ai-details.json
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          SEED_SEEN_ONLY: ${{ vars.SEED_SEEN_ONLY }}
          CAREER_AGENT_TOKEN: ${{ secrets.CAREER_AGENT_TOKEN }}
          CAREER_AGENT_SYNC_ENABLED: ${{ vars.CAREER_AGENT_SYNC_ENABLED }}
          CAREER_AGENT_SEEN_GATE: ${{ vars.CAREER_AGENT_SEEN_GATE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAREER_PROJECT_OWNER: ${{ vars.CAREER_PROJECT_OWNER }}
          CAREER_PROJECT_NUMBER: ${{ vars.CAREER_PROJECT_NUMBER }}
          PROJECT_BOARD_URL: ${{ vars.PROJECT_BOARD_URL }}
        run: |
          echo "COLLECT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          python3 scripts/run_pipeline.py

      - name: Mark Kyiv collect slot completed
        id: slot
        if: success() && steps.pipe.outcome == 'success'
        run: python3 scripts/mark_collect_slot.py

      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/collect.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish runtime state
        id: commit_seen
        if: ${{ !cancelled() && (steps.pipe.outcome == 'success' || steps.pipe.outcome == 'failure') }}
        run: python3 scripts/runtime_state.py publish

      - name: Upload collection recovery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            database/seen.json
            database/source_baseline.json
            database/telegram_cursors.json
            database/collect_slots.json
            database/daily_email_days.json
            diagnostics/runtime-state*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Trigger Daily Email Report
        id: dispatch_email
        if: steps.slot.outputs.dispatch_daily_email == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          attempt=1
          max_attempts=5
          delay=15
          while true; do
            echo "Dispatch Daily Email attempt ${attempt}/${max_attempts}"
            if gh workflow run "Daily Email Report" --repo "${repo}" --ref main; then
              echo "Daily Email Report dispatched successfully"
              exit 0
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "Failed to dispatch Daily Email Report after ${max_attempts} attempts" >&2
              exit 1
            fi
            echo "Dispatch failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "TELEGRAM_* missing — skip failure alert"
            exit 0
          fi
          reason="unknown step"
          if [ "${{ steps.pipe.conclusion }}" = "failure" ]; then reason="pipeline / Telegram notify"; fi
          if [ "${{ steps.slot.conclusion }}" = "failure" ]; then reason="mark collect slot"; fi
          if [ "${{ steps.commit_seen.conclusion }}" = "failure" ]; then reason="commit seen/slots"; fi
          if [ "${{ steps.dispatch_email.conclusion }}" = "failure" ]; then reason="dispatch Daily Email"; fi
          text="$(printf '⚠️ Collect iOS Jobs failed (%s)\n%s/%s/actions/runs/%s' \
            "${reason}" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" >/dev/null

  imap:
    needs: collect
    if: ${{ !cancelled() && needs.collect.result != 'skipped' }}
    uses: ./.github/workflows/imap-poll.yml
    secrets: inherit
