name: Daily Vacancy Liveness

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC daily (incl. weekends) ≈ 07:00 Kyiv in summer / 06:00 in winter.
    - cron: "0 4 * * *"

permissions:
  contents: read
  issues: read

concurrency:
  group: daily-vacancy-liveness-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  liveness:
    concurrency:
      group: career-state-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore optional liveness cadence cache
        uses: actions/cache@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: .cache/liveness.json
          key: liveness-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: liveness-v1-${{ runner.os }}-

      - name: Check closed vacancies
        env:
          LIVENESS_CACHE_PATH: .cache/liveness.json
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAREER_AGENT_TOKEN: ${{ secrets.CAREER_AGENT_TOKEN }}
          CAREER_AGENT_SYNC_ENABLED: ${{ vars.CAREER_AGENT_SYNC_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAREER_PROJECT_OWNER: ${{ vars.CAREER_PROJECT_OWNER }}
          CAREER_PROJECT_NUMBER: ${{ vars.CAREER_PROJECT_NUMBER }}
          PROJECT_BOARD_URL: ${{ vars.PROJECT_BOARD_URL }}
        run: python3 scripts/run_vacancy_liveness.py
