name: CRM Manual Card

# Upsert a private Career CRM draft (Applied / Archived / …).
# Cloud-agent PAT often lacks Projects scope; Actions CAREER_AGENT_TOKEN has it.
on:
  workflow_dispatch:
    inputs:
      company:
        description: Company name
        required: true
        type: string
      title:
        description: Role title
        required: true
        type: string
      url:
        description: Vacancy URL
        required: true
        type: string
      status:
        description: Project Status
        required: true
        type: choice
        options:
          - Applied
          - Replied
          - Screening
          - Post-Screen
          - Technical
          - Post-Tech
          - Archived
          - Inbox
        default: Applied
      channel:
        description: Channel
        required: false
        type: choice
        options:
          - Djinni
          - DOU
          - LinkedIn
          - Telegram
          - Company site
          - Recruiter
          - Other
        default: Djinni
      source:
        description: Source label
        required: false
        type: string
        default: Djinni
      applied_at:
        description: Applied At (YYYY-MM-DD)
        required: false
        type: string
      salary:
        description: Salary note
        required: false
        type: string
      summary:
        description: Short summary
        required: false
        type: string
      recruiter:
        description: Recruiter name
        required: false
        type: string
      close_reason:
        description: Close Reason (when Archived)
        required: false
        type: string
      closed_stage:
        description: Closed Stage (when Archived)
        required: false
        type: string
  push:
    branches:
      - "cursor/tango-applied-crm-6315"
    paths:
      - ".github/workflows/crm-manual-card.yml"
      - "database/crm_upsert_once.json"

permissions:
  contents: read

concurrency:
  group: crm-manual-card-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Resolve card fields
        id: card
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "company=${{ inputs.company }}"
              echo "title=${{ inputs.title }}"
              echo "url=${{ inputs.url }}"
              echo "status=${{ inputs.status }}"
              echo "channel=${{ inputs.channel }}"
              echo "source=${{ inputs.source }}"
              echo "applied_at=${{ inputs.applied_at }}"
              echo "salary=${{ inputs.salary }}"
              echo "summary=${{ inputs.summary }}"
              echo "recruiter=${{ inputs.recruiter }}"
              echo "close_reason=${{ inputs.close_reason }}"
              echo "closed_stage=${{ inputs.closed_stage }}"
            } >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path("database/crm_upsert_once.json").read_text(encoding="utf-8"))
          for key in (
              "company", "title", "url", "status", "channel", "source",
              "applied_at", "salary", "summary", "recruiter",
              "close_reason", "closed_stage",
          ):
              value = data.get(key) or ""
              print(f"{key}={value}")
          PY
          fi

      - name: Upsert CRM card
        env:
          CAREER_AGENT_TOKEN: ${{ secrets.CAREER_AGENT_TOKEN }}
          CAREER_AGENT_SYNC_ENABLED: ${{ vars.CAREER_AGENT_SYNC_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAREER_PROJECT_OWNER: ${{ vars.CAREER_PROJECT_OWNER }}
          CAREER_PROJECT_NUMBER: ${{ vars.CAREER_PROJECT_NUMBER }}
          PROJECT_BOARD_URL: ${{ vars.PROJECT_BOARD_URL }}
        run: |
          set -euo pipefail
          args=(
            --company "${{ steps.card.outputs.company }}"
            --title "${{ steps.card.outputs.title }}"
            --url "${{ steps.card.outputs.url }}"
            --status "${{ steps.card.outputs.status }}"
          )
          if [ -n "${{ steps.card.outputs.channel }}" ]; then
            args+=(--channel "${{ steps.card.outputs.channel }}")
          fi
          if [ -n "${{ steps.card.outputs.source }}" ]; then
            args+=(--source "${{ steps.card.outputs.source }}")
          fi
          if [ -n "${{ steps.card.outputs.applied_at }}" ]; then
            args+=(--applied-at "${{ steps.card.outputs.applied_at }}")
          fi
          if [ -n "${{ steps.card.outputs.salary }}" ]; then
            args+=(--salary "${{ steps.card.outputs.salary }}")
          fi
          if [ -n "${{ steps.card.outputs.summary }}" ]; then
            args+=(--summary "${{ steps.card.outputs.summary }}")
          fi
          if [ -n "${{ steps.card.outputs.recruiter }}" ]; then
            args+=(--recruiter "${{ steps.card.outputs.recruiter }}")
          fi
          if [ -n "${{ steps.card.outputs.close_reason }}" ]; then
            args+=(--close-reason "${{ steps.card.outputs.close_reason }}")
          fi
          if [ -n "${{ steps.card.outputs.closed_stage }}" ]; then
            args+=(--closed-stage "${{ steps.card.outputs.closed_stage }}")
          fi
          python3 scripts/add_manual_card.py "${args[@]}"
